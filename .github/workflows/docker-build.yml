name: Build and Push OpenVPN Container

on:
  push:
    branches: [ "main" ]
  schedule:
    # Запуск каждое воскресенье в 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Кастомная версия Alpine (оставьте пустым для автоопределения)'
        required: false
        type: string
      openvpn_version:
        description: 'Кастомная версия OpenVPN (оставьте пустым для автоопределения)'
        required: false
        type: string
      force_build:
        description: 'Принудительная сборка (игнорировать проверку версий)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Требуется для автоматического обновления файла current_versions
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse current versions file
        id: current_vers
        run: |
          if [ -f current_versions ]; then
            source current_versions
            echo "alpine=$current_alpine_version" >> $GITHUB_OUTPUT
            echo "openvpn=$current_openvpn_version" >> $GITHUB_OUTPUT
          else
            echo "Ошибка: Файл current_versions не найден!"
            exit 1
          fi

      - name: Check for new upstream versions
        id: check_updates
        run: |
         # 1. Определение целевой версии Alpine
         if [ -n "${{ github.event.inputs.alpine_version }}" ]; then
           NEW_ALPINE="${{ github.event.inputs.alpine_version }}"
         else
          # Берем 100 последних тегов, фильтруем по формату X.Y.Z, сортируем как версии по убыванию и берем самую свежую
          NEW_ALPINE=$(curl -s "https://registry.hub.docker.com/v2/repositories/library/alpine/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V -r \
            | head -n 1)
         fi

          # 2. Определение целевой версии OpenVPN
         if [ -n "${{ github.event.inputs.openvpn_version }}" ]; then
          NEW_OPENVPN="${{ github.event.inputs.openvpn_version }}"
         else
         # ИДЕЯ (Пункт 5): Добавлен GITHUB_TOKEN в заголовок, чтобы не поймать Rate Limit, как это было с iptables!
          NEW_OPENVPN=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/OpenVPN/openvpn/releases/latest" \
             | jq -r '.tag_name' \
             | sed 's/^v//')
         fi
          

          # Запись определенных версий в outputs
          echo "target_alpine=${NEW_ALPINE:-1}" >> $GITHUB_OUTPUT
          echo "target_openvpn=${NEW_OPENVPN:-1}" >> $GITHUB_OUTPUT

          # Логика сравнения
          SHOULD_BUILD="false"
          
          if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
            echo "Принудительный запуск сборки через workflow_dispatch."
          SHOULD_BUILD="true"
          elif [ "$NEW_ALPINE" != "${{ steps.current_vers.outputs.alpine }}" ] || \
               [ "$NEW_OPENVPN" != "${{ steps.current_vers.outputs.openvpn }}" ]; then
           echo "Обнаружены новые версии компонент!"
          SHOULD_BUILD="true"
          else
          echo "Все версии актуальны. Сборка не требуется."
          fi

         echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Set up QEMU (for multi-arch)
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_updates.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # Все ARM-архитектуры + стандартный x86_64
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          build-args: |
            ALPINE_VERSION=${{ steps.check_updates.outputs.target_alpine }}
            OPENVPN_VERSION=${{ steps.check_updates.outputs.target_openvpn }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ steps.check_updates.outputs.target_alpine }}-openvpn-${{ steps.check_updates.outputs.target_openvpn }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.check_updates.outputs.target_openvpn }}
       provenance: false

      - name: Update current_versions file in repository
        if: steps.check_updates.outputs.should_build == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          cat <<EOF > current_versions
          current_alpine_version=${{ steps.check_updates.outputs.target_alpine }}
          current_openvpn_version=${{ steps.check_updates.outputs.target_openvpn }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_versions
          git commit -m "chore: auto-update versions in current_versions [skip ci]" || exit 0
          git push
