name: Build and Push OpenVPN Container

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine version (e.g., 3.20). Leave empty for auto-detection.'
        required: false
        default: ''
      openvpn_version:
        description: 'OpenVPN version (e.g., 2.6.10). Leave empty for auto-detection.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # contents: read
      packages: write
      contents: write   # для обновления current_versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (для многоплатформенной сборки)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ------------------------------------------------------------
      # 1) Определяем версии (автоматически или вручную)
      # ------------------------------------------------------------
      - name: Determine versions
        id: versions
        run: |
          if [ -n "${{ github.event.inputs.alpine_version }}" ] || [ -n "${{ github.event.inputs.openvpn_version }}" ]; then
            # Ручной режим
            ALPINE="${{ github.event.inputs.alpine_version }}"
            OPENVPN="${{ github.event.inputs.openvpn_version }}"
            if [ -z "$ALPINE" ]; then
              ALPINE=$(curl -s https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml | grep 'version:' | head -1 | awk '{print $2}')
            fi
            IPTABLES=$(docker run --rm "alpine:$ALPINE" sh -c "apk list iptables 2>/dev/null | sed -n 's/^iptables-\([0-9.]*\)-.*/\1/p'")
            if [ -z "$IPTABLES" ]; then
              echo "⚠️  Could not fetch iptables version for $ALPINE, using fallback"
              IPTABLES="unknown"
            fi
            echo "alpine_version=$ALPINE" >> $GITHUB_OUTPUT
            echo "openvpn_version=$OPENVPN" >> $GITHUB_OUTPUT
            echo "iptables_version=$IPTABLES" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "manual=true" >> $GITHUB_OUTPUT
          else
            # Автоматический режим – запускаем скрипт проверки
            chmod +x scripts/check_versions.sh
            ./scripts/check_versions.sh
          fi

      # ------------------------------------------------------------
      # 2) Если изменений нет – выходим (пропускаем сборку)
      # ------------------------------------------------------------
      - name: Skip if no changes
        if: steps.versions.outputs.should_build != 'true'
        run: |
          echo "No new versions detected, skipping build."
          exit 0

      # ------------------------------------------------------------
      # 3) Логин в GHCR (только если нужна сборка)
      # ------------------------------------------------------------
      - name: Log in to GHCR
        if: steps.versions.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 4) Сборка и публикация образа (только если нужна сборка)
      # ------------------------------------------------------------
      - name: Build and push Docker image
        if: steps.versions.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.openvpn_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ steps.versions.outputs.alpine_version }}-openvpn-${{ steps.versions.outputs.openvpn_version }}
          build-args: |
            ALPINE_VERSION=${{ steps.versions.outputs.alpine_version }}
            OPENVPN_VERSION=${{ steps.versions.outputs.openvpn_version }}
            IPTABLES_VERSION=${{ steps.versions.outputs.iptables_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------
      # 5) Обновляем current_versions (только если автоматический запуск и были изменения)
      # ------------------------------------------------------------
      - name: Update current_versions file
        if: |
          steps.versions.outputs.should_build == 'true' &&
          steps.versions.outputs.manual != 'true'
        run: |
          ALPINE="${{ steps.versions.outputs.alpine_version }}"
          OPENVPN="${{ steps.versions.outputs.openvpn_version }}"
          IPTABLES="${{ steps.versions.outputs.iptables_version }}"
          cat > current_versions <<EOF
          current_alpine_version=$ALPINE
          current_openvpn_version=$OPENVPN
          current_iptables_version=$IPTABLES
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_versions
          git commit -m "chore: update current_versions [skip ci]" || echo "No changes to commit"
          git push
